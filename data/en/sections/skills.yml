skills:
- name: Cloud & Infrastructure
  logo: "/images/sections/skills/cloud.png"
  summary: "Build and operate infrastructure across AWS, Azure, OCI, and GCP using Kubernetes, Docker, Terraform, Ansible, and Packer."

- name: Observability & Reliability
  logo: "/images/sections/skills/hardware.svg"
  summary: "Use Prometheus and Grafana for SLO-based alerting and SLA management. Lead incident response and improve monitoring, runbooks, and operational guardrails through post-incident reviews."

- name: Networking & Security
  logo: "/images/sections/skills/network.png"
  summary: "Work with TCP/IP, DNS, TLS and certificate lifecycle management, Tailscale/WireGuard, HashiCorp Vault, and Consul to support secure, reliable services."

- name: CI/CD & Automation
  logo: "/images/sections/skills/git.png"
  summary: "Build delivery pipelines and infrastructure automation with Git, GitHub Actions, Bamboo, TeamCity, Octopus Deploy, and AWS CodeBuild/CodePipeline. Use shell scripting, Python, and Infrastructure as Code to reduce manual operations."

- name: Languages & Frameworks
  logo: "/images/sections/skills/generalist.png"
  summary: "Develop tooling and automation with Python, JavaScript/Node.js, SQL, and shell scripting, with additional experience in Perl and Java. Build native desktop software in Rust through u-forge.ai."

- name: Databases & Search
  logo: "/images/sections/skills/docker.svg"
  summary: "Operate and support Aerospike, SQL Server, RavenDB, and NoSQL systems. Implement SQLite FTS5 keyword search, sqlite-vec semantic search, and hybrid reciprocal rank fusion retrieval in [u-forge.ai](/posts/u-forge-ai/)."

- name: Rust & Local AI / GraphRAG
  logo: "/images/sections/skills/generalist.png"
  summary: "Built [u-forge.ai](/posts/u-forge-ai/), a Rust-native desktop TTRPG graph-notes app with GraphRAG retrieval and optional local inference via Lemonade. Implemented cancellable, resource-aware jobs and multi-device inference queuing across NPU, CPU, and GPU."

- name: Linux & Platform Operations
  logo: "/images/sections/skills/linux.png"
  summary: "Administer Linux systems, containers, bare-metal servers, and virtual machines. Work with Nginx and Traefik, storage and RAID, and IOMMU device passthrough."

- name: Engineering Collaboration
  logo: "/images/sections/skills/shell.svg"
  summary: "Work in Agile/Scrum teams using Jira. Lead cross-functional reliability work, mentor engineers on infrastructure and delivery practices, and document repeatable operational processes."
