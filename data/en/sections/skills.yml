skills:
- name: Cloud & Infrastructure
  logo: "/images/sections/skills/cloud.png"
  summary: "I build and operate infrastructure across AWS, Azure, OCI, and GCP using Kubernetes, Docker, Terraform, Ansible, and Packer."

- name: Observability & Reliability
  logo: "/images/sections/skills/hardware.svg"
  summary: "I use Prometheus and Grafana to monitor service reliability against SLOs and SLAs. I lead incident response and use post-incident reviews to improve alerts, runbooks, and operational safeguards."

- name: Networking & Security
  logo: "/images/sections/skills/network.png"
  summary: "I work with TCP/IP, DNS, TLS, Tailscale/WireGuard, HashiCorp Vault, and Consul to secure services and keep them connected. My work includes certificate and secret lifecycle automation."

- name: CI/CD & Automation
  logo: "/images/sections/skills/git.png"
  summary: "I automate builds, deployments, and infrastructure with Git, GitHub Actions, Bamboo, TeamCity, Octopus Deploy, and AWS CodeBuild/CodePipeline. I use shell scripts, Python, and infrastructure as code to reduce manual work."

- name: Languages & Frameworks
  logo: "/images/sections/skills/generalist.png"
  summary: "I write tools and automation in Python, JavaScript/Node.js, SQL, and shell, and build native desktop software in Rust. I also have experience with Perl and Java."

- name: Databases & Search
  logo: "/images/sections/skills/docker.svg"
  summary: "My database experience includes Aerospike, SQL Server, RavenDB, and SQLite. In [u-forge.ai](/posts/u-forge-ai/), I combine FTS5 keyword search and sqlite-vec semantic search using reciprocal rank fusion to merge the results."

- name: Rust & Local AI
  logo: "/images/sections/skills/generalist.png"
  summary: "I'm building [u-forge.ai](/posts/u-forge-ai/) in Rust, using a knowledge graph to retrieve context for an AI assistant and Lemonade for local inference. My work includes job cancellation and inference queues that schedule work across available NPU, CPU, and GPU resources."

- name: Linux & Platform Operations
  logo: "/images/sections/skills/linux.png"
  summary: "I administer Linux systems, containers, physical servers, and virtual machines. I work with Nginx and Traefik, storage and RAID, and IOMMU device passthrough."

- name: Engineering Collaboration
  logo: "/images/sections/skills/shell.svg"
  summary: "I coordinate reliability work across teams, mentor engineers on infrastructure and delivery practices, and write operational documentation. I have experience with Agile/Scrum teams and Jira."
