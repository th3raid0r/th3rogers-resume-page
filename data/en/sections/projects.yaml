- name: u-forge.ai (Universe Forge)
  role: Creator & Developer
  timeline: "2026 - Present"
  repo: "https://github.com/th3raid0r/u-forge.ai"
  image: /images/projects/u-forge.ai/u-forge-ai.png
  summary: |-
    I'm building a Rust desktop application that connects tabletop RPG notes in a knowledge graph. It combines keyword and semantic search with an optional AI assistant that can search and update world data. Local inference queues schedule work across available NPU, CPU, and GPU backends.

    The application is in alpha for Linux x86_64, and I'm refining search relevance and retrieval precision. [Read about the design and development](/posts/u-forge-ai/).
  tags: ["ai", "hobby", "education", "Rust", "GraphRAG", "local-first"]

- name: Tucson.social
  role: Founder & Operator
  timeline: "June 2023 - Present"
  url: "https://tucson.social"
  icon: /images/projects/tucsocial/tucsocial.png
  image: /images/projects/tucsocial/tucsocial-screen.png
  summary: |-
    I founded and run community services for Tucson: [Lemmy discussion](https://tucson.social), [Matrix messaging](https://tucson.chat), and [Mobilizon events](https://meetup.tucson.social). I designed the infrastructure on Oracle Cloud (OCI) and manage its containers, DNS, TLS, and monitoring. Geographic access controls keep the services focused on the Tucson area and reduce abuse and moderation work, while federation connects the community to the wider network.

    I'm also working with community members on governance and sustainable funding for a nonprofit transition, including evaluating fiscal sponsorship.
  tags: ["community", "OCI", "federation", "self-hosting"]

