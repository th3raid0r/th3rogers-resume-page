# a summary about you
summary: |-
  I am a Senior SRE with 13+ years in infrastructure, reliability, and platform engineering. At Aerospike, I drive cross-functional reliability initiatives, improve SLO-based alerting, automate cloud operations, and lead incident response. My work combines deep technical expertise with engineering leadership and mission-driven product thinking.

  Outside my day job, I build [u-forge.ai](/posts/u-forge-ai/), a local-first Rust desktop application for tabletop RPG worldbuilding. It brings together a knowledge graph, hybrid GraphRAG retrieval, and resource-aware local inference—applying reliability engineering to an AI-assisted creative workspace.

  I also founded and operate [Tucson.social](https://tucson.social), a suite of federated community platforms spanning discussion, messaging, and events. I own its architecture and operations while developing a governance framework and financial sustainability model for a nonprofit transition. [Explore my projects](#projects).

