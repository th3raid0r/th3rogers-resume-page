# a summary about you
summary: |-
  I'm a senior site reliability engineer with 13+ years in infrastructure, reliability, and platform engineering. At Aerospike, I work with product teams to improve cloud reliability, make alerts more useful, automate operations, and lead incident response.

  Outside work, I'm building [u-forge.ai](/posts/u-forge-ai/), a Rust desktop application for tabletop RPG worldbuilding. It connects campaign notes through a knowledge graph and uses local AI to help game masters search and develop their settings.

  I also founded and run [Tucson.social](https://tucson.social), a collection of community services for discussion, messaging, and events. I manage the infrastructure and am working on community governance and sustainable funding as part of a planned nonprofit transition. [Explore my projects](#projects).

