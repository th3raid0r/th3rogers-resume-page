- company:
    name: Aerospike
    url: "https://www.aerospike.com"
    location: Mountain View, CA (Remote)
    # company overview
    overview: A high-performance real-time distributed database.
  positions:
  - designation: Senior Cloud Software Reliability Engineer (Cloud SRE)
    start: May 2022
    # don't provide end date if you are currently working there. It will be replaced by "Present"
    # end:
    # give some points about what was your responsibilities at the company.
    responsibilities:
    - Embed with product development teams to drive SLO-based alerting and cloud platform reliability; uphold SLA compliance across approximately 30 production customer environments using Grafana and Prometheus.
    - Reduced false-positive alerts from dozens per week to 1–2 through threshold recalibration and configuration-aware monitoring.
    - Coordinate the SRE transition of shared HashiCorp Vault infrastructure, including provisioning and service consumer enablement.
    - Automated DNS and certificate lifecycle management for a Kubernetes-based managed cloud offering, eliminating manual customer IP notifications and certificate rotation.
    - Architected the migration from OpenVPN to Tailscale (WireGuard) to improve network reliability and reduce cross-environment operational overhead.
    - Drive high-availability improvements and automated operational guardrails; evaluate cross-cloud options to mitigate specialized instance capacity constraints.
    - Serve as incident commander during on-call rotations, owning triage, investigation, and resolution; provide escalation support for complex cross-system incidents.
    - Improve runbooks, operational guardrails, and monitoring coverage through post-incident reviews.
    - Deliver and maintain customer infrastructure with Packer, Terraform, and Ansible, including modules for cloud agents that enhance I/O performance.
