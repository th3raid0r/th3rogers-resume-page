- company:
    name: Aerospike
    url: "https://www.aerospike.com"
    location: Mountain View, CA (Remote)
    # company overview
    overview: Distributed database software for real-time applications.
  positions:
  - designation: Senior Cloud Software Reliability Engineer (Cloud SRE)
    start: May 2022
    # don't provide end date if you are currently working there. It will be replaced by "Present"
    # end:
    # give some points about what was your responsibilities at the company.
    responsibilities:
    - Work with product development teams to improve cloud reliability and SLO-based alerting. Monitor approximately 30 production customer environments with Grafana and Prometheus to maintain SLA compliance.
    - Lead high-availability improvements and automate operational safeguards.
    - Serve as incident commander during on-call rotations, leading triage, investigation, and resolution. Support escalations for complex incidents and use post-incident reviews to improve runbooks and monitoring.
    - Provision and maintain customer infrastructure with Packer, Terraform, and Ansible, including modules for cloud agents that improve I/O performance.
    - Reduced false-positive alerts from dozens per week to 1–2 through threshold recalibration and configuration-aware monitoring.
    - Automated DNS and certificate lifecycle management for a Kubernetes-based managed cloud offering, eliminating manual customer IP notifications and certificate rotation.
    - Designed the migration from OpenVPN to Tailscale (WireGuard) to improve network reliability and simplify operations across environments.
    - Coordinated the transfer of shared HashiCorp Vault infrastructure to the SRE team, including plans for provisioning and helping teams use the service.
    - Evaluated options across cloud providers to address capacity constraints for specialized instance types.
